<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>有給申請テスト</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; line-height: 1.7; background: #f6f7f8; color: #222; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  h2 { font-size: .95rem; margin: 0 0 6px; }
  .card { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card.todo { border: 2px solid #e0a100; }
  .name { font-size: 1.2rem; font-weight: 700; }
  .big { font-size: 2.2rem; font-weight: 700; line-height: 1.2; }
  .big small { font-size: 1rem; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e3e5e8; }
  th { color: #777; font-weight: 400; }
  td.num, th.num { text-align: right; }
  label { display: block; font-weight: 700; margin-top: 10px; }
  input[type=date], textarea { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  textarea { min-height: 4.5em; }
  button { width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem; font-weight: 700; color: #fff; background: #1a6fb5; border: 0; border-radius: 8px; }
  button.sub { background: #fff; color: #1a6fb5; border: 2px solid #1a6fb5; }
  button.small { width: auto; padding: 6px 12px; font-size: .85rem; }
  button:disabled { opacity: .5; }
  .item { border-top: 1px solid #e3e5e8; padding: 10px 0; }
  .item:first-of-type { border-top: 0; }
  .ok { color: #0a7a3d; font-weight: 700; }
  .ng { color: #c0392b; font-weight: 700; }
  .muted { color: #777; font-size: .85rem; }
  .tag { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: .8rem; background: #e8eef4; }
  .tag.cancel { background: #eee; color: #888; }
  .tag.done { background: #dff3e6; color: #0a7a3d; }
  .tag.consult { background: #fdeccd; color: #8a5a00; }
  .hidden { display: none; }
  ol { padding-left: 1.2em; margin: 0; }
</style>
<!-- WOFFの部品（SDK）。公式ドキュメント記載のURL -->
<script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.4/sdk.js"></script>
</head>
<body>
<h1>有給休暇の申請（テスト）</h1>

<div class="card">
  <div class="muted">この画面を開いた人</div>
  <div class="name" id="who">確認中…</div>
  <div class="muted" id="whoSheet"></div>
</div>

<!-- 確認者にだけ出る。自分が確認する番の申請 -->
<div class="card todo hidden" id="pendingCard">
  <h2>確認待ち（<span id="pendingCount">0</span>件）</h2>
  <div id="pending"></div>
  <div id="confirmResult"></div>
</div>

<div class="card">
  <h2>残日数</h2>
  <div class="big"><span id="total">–</span> <small>日</small></div>
  <div class="muted" id="asof"></div>
  <table>
    <thead>
      <tr><th>付与日</th><th class="num">付与</th><th class="num">使用</th><th class="num">残り</th><th>時効日</th></tr>
    </thead>
    <tbody id="lots"></tbody>
  </table>
  <div class="muted">確認中・相談中の申請も、使った分として数えています。古い付与から先に使います。</div>
  <div class="ng" id="warn"></div>
</div>

<form class="card" id="form">
  <h2>申請する</h2>
  <label for="date">取得日</label>
  <input type="date" id="date" required>

  <label>日数</label>
  <div>1日</div>

  <label for="reason">理由（任意）</label>
  <textarea id="reason" maxlength="200" placeholder="書かなくても申請できます"></textarea>

  <button type="submit" id="send" disabled>申請する</button>
</form>

<div class="card">
  <div class="muted">結果</div>
  <div id="result">まだ送っていません</div>
</div>

<div class="card">
  <h2>自分の申請</h2>
  <table>
    <thead>
      <tr><th>取得日</th><th class="num">日数</th><th>状態</th><th>申請番号</th></tr>
    </thead>
    <tbody id="requests"></tbody>
  </table>
  <div class="muted" id="noreq"></div>
</div>

<div class="card">
  <div class="muted">進み具合</div>
  <ol id="log"></ol>
</div>

<div class="card">
  <div class="muted">試験用（手順書で指示があったときだけ押します）</div>
  <button type="button" class="sub small" id="scopeBtn" disabled>通行証の範囲を確かめる</button>
  <div id="scopeResult" class="muted"></div>
</div>

<p class="muted">版: 6</p>

<script>
// ===== 設定（ここだけ書き換える） =====
const WOFF_ID = 'p4tHnIeJWfEQ663pDApM4g';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzh6s9cE4YqZKc239fBw41XvB-cdAl7FCH89dqMSb3dNf-HOh75n24YIbpHjoj4V3J9mA/exec';
const WOFF_SCOPE = 'user.read'; // 通行証の範囲を、社員名簿の読み取りだけに絞る
// =====================================

const $ = function (id) { return document.getElementById(id); };

function log(text) {
  const li = document.createElement('li');
  li.textContent = text;
  $('log').appendChild(li);
}

// 要素を作る小さな部品（文字はすべて textContent で入れる）
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

// 今日の日付（端末の時刻で YYYY-MM-DD）。過去の日付を選べないようにする
function todayString() {
  const d = new Date();
  const p = function (n) { return ('0' + n).slice(-2); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function showResult(id, ok, text) {
  const box = $(id);
  box.textContent = text;
  box.className = ok ? 'ok' : 'ng';
}

// 表の1行を作る
function addRow(tbody, cells) {
  const tr = document.createElement('tr');
  cells.forEach(function (c) {
    const td = document.createElement('td');
    if (c && c.node) {
      td.appendChild(c.node);
    } else {
      td.textContent = (c && c.text !== undefined) ? c.text : c;
    }
    if (c && c.num) td.className = 'num';
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
}

// 状態の札
function stateTag(state) {
  let cls = 'tag';
  if (state === '取消') cls += ' cancel';
  if (state === '成立') cls += ' done';
  if (state === '日程変更の相談中') cls += ' consult';
  return el('span', cls, state);
}

// GASを呼ぶ（Content-Typeをtext/plainにする定石）
async function callGas(payload) {
  const token = woff.getAccessToken();
  if (!token) throw new Error('通行証を取得できませんでした。画面を開き直してください');
  payload.accessToken = token;

  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error('GASの応答がJSONではありません（先頭: ' + text.slice(0, 80) + '）');
  }
}

// 確認待ちの一覧を描く
function renderPending(list) {
  const box = $('pending');
  box.textContent = '';
  $('pendingCount').textContent = list.length;
  $('pendingCard').className = list.length > 0 ? 'card todo' : 'card todo hidden';

  list.forEach(function (p) {
    const item = el('div', 'item');
    item.appendChild(el('div', 'name', p.date + '（' + p.days + '日）'));
    item.appendChild(el('div', null, '申請者: ' + p.applicantName + '（' + p.company + '）'));
    item.appendChild(el('div', null, '理由: ' + (p.reason ? p.reason : '（記入なし）')));
    item.appendChild(el('div', 'muted', '申請番号 ' + p.requestId + ' ／ 申請日時 ' + p.appliedAt));

    const comment = document.createElement('textarea');
    comment.maxLength = 200;
    comment.placeholder = 'コメント（日程変更の相談では必ず書きます）';
    item.appendChild(comment);

    const okBtn = el('button', null, '確認（受理）');
    okBtn.type = 'button';
    const consultBtn = el('button', 'sub', '日程変更の相談');
    consultBtn.type = 'button';
    item.appendChild(okBtn);
    item.appendChild(consultBtn);

    okBtn.addEventListener('click', function () { sendConfirm(p.requestId, 'confirm', comment, [okBtn, consultBtn]); });
    consultBtn.addEventListener('click', function () { sendConfirm(p.requestId, 'consult', comment, [okBtn, consultBtn]); });

    box.appendChild(item);
  });
}

// 確認者の操作を送る
async function sendConfirm(requestId, decision, commentBox, buttons) {
  if (decision === 'consult' && !commentBox.value.trim()) {
    showResult('confirmResult', false, '日程変更の相談には、コメント（相談の内容）を書いてください');
    return;
  }
  buttons.forEach(function (b) { b.disabled = true; }); // 二重に送らない
  showResult('confirmResult', true, '送信中…');
  try {
    const data = await callGas({
      action: 'confirmRequest',
      requestId: requestId,
      decision: decision,
      comment: commentBox.value
    });
    if (data.ok) {
      let text = '記録しました。申請 ' + data.requestId + ' の状態: ' + data.state;
      if (data.advanced) text += ' ／ 次の確認者へ: ' + data.notifyNote;
      showResult('confirmResult', true, text);
      await loadStatus();
    } else {
      showResult('confirmResult', false, '記録できませんでした: ' + data.error);
      buttons.forEach(function (b) { b.disabled = false; });
    }
  } catch (err) {
    showResult('confirmResult', false, 'エラー: ' + (err && err.message ? err.message : err));
    buttons.forEach(function (b) { b.disabled = false; });
  }
}

// 残日数・申請の一覧・確認待ちを取り直して表示する
async function loadStatus() {
  const data = await callGas({ action: 'getMyStatus' });
  if (!data.ok) throw new Error(data.error);

  $('whoSheet').textContent = '表の上の名前: ' + data.name + '（' + data.company + '）';
  $('total').textContent = data.total;
  $('asof').textContent = data.asOf + ' 時点';

  const lots = $('lots');
  lots.textContent = '';
  data.lots.forEach(function (l) {
    addRow(lots, [
      l.grantDate,
      { text: l.days, num: true },
      { text: l.used, num: true },
      { text: l.remaining, num: true },
      l.expireDate
    ]);
  });

  const warns = [];
  if (data.hasShortage) warns.push('残日数を超えている申請があります。総務に連絡してください。');
  if (data.badRows > 0) warns.push('表に、日付や日数の形が違う行が ' + data.badRows + ' 行あります。');
  $('warn').textContent = warns.join(' ');

  const reqs = $('requests');
  reqs.textContent = '';
  data.requests.forEach(function (r) {
    addRow(reqs, [r.date, { text: r.days, num: true }, { node: stateTag(r.state) }, r.requestId]);
  });
  $('noreq').textContent = data.requests.length === 0 ? '申請はまだありません' : '';

  renderPending(data.pending || []);
  log('表示を更新しました（確認待ち ' + (data.pending || []).length + '件）');
}

async function main() {
  $('date').min = todayString();

  // 試験用：URLに申請番号が付いて届いたかを記録する
  const reqParam = new URLSearchParams(location.search).get('req');
  log('URLの申請番号: ' + (reqParam ? reqParam + '（届きました）' : 'なし'));

  // 1. WOFFの初期化
  log('WOFFを初期化します');
  await woff.init({ woffId: WOFF_ID, scope: WOFF_SCOPE });

  // 2. PCのブラウザなどで開いた場合は、ログインが必要
  if (!woff.isInClient() && !woff.isLoggedIn()) {
    log('ログイン画面に移ります');
    woff.login({ scope: WOFF_SCOPE });
    return;
  }

  // 3. 開いた人の名前を出す（表示用。本人の確定はGAS側で行う）
  const profile = await woff.getProfile();
  $('who').textContent = profile.displayName + ' さん';

  // 4. 残日数・申請の一覧・確認待ちを出す
  await loadStatus();
  $('send').disabled = false;
  $('scopeBtn').disabled = false;
}

// 申請を送る
async function submitLeave(ev) {
  ev.preventDefault();
  const button = $('send');
  button.disabled = true; // 二重に送らないよう、押したら止める
  showResult('result', true, '送信中…');

  try {
    const data = await callGas({
      action: 'submitLeave',
      date: $('date').value,
      days: 1,
      reason: $('reason').value
    });

    if (data.ok) {
      showResult('result', true, '受け付けました。申請番号 ' + data.requestId + ' ／ ' + data.date + ' ／ ' + data.days + '日 ／ 状態: ' + data.state);
      log((data.notified ? '通知: ' : '通知なし: ') + (data.notifyNote || ''));
      $('reason').value = '';
      await loadStatus();
    } else {
      showResult('result', false, '受け付けられませんでした: ' + data.error);
    }
  } catch (err) {
    showResult('result', false, 'エラー: ' + (err && err.message ? err.message : err));
  } finally {
    button.disabled = false;
  }
}

// 試験用：通行証の範囲を確かめる
async function runScopeTest() {
  const box = $('scopeResult');
  box.textContent = '確かめています…';
  try {
    const d = await callGas({ action: 'scopeTest' });
    if (!d.ok) throw new Error(d.error);
    const judge = function (code, shouldWork) {
      const works = (code >= 200 && code < 300);
      return code + '（' + (works ? 'できる' : 'できない') + '＝' + (works === shouldWork ? '想定どおり' : '想定と違う') + '）';
    };
    box.textContent = '社員名簿の読み取り: ' + judge(d.usersMe, true) +
      ' ／ Bot送信: ' + judge(d.botSend, false) +
      ' ／ カレンダー: ' + judge(d.calendar, false);
  } catch (err) {
    box.textContent = 'エラー: ' + (err && err.message ? err.message : err);
  }
}

$('form').addEventListener('submit', submitLeave);
$('scopeBtn').addEventListener('click', runScopeTest);

main().catch(function (err) {
  log('エラー: ' + (err && (err.code || '')) + ' ' + (err && err.message ? err.message : err));
  if ($('who').textContent === '確認中…') $('who').textContent = '取得できませんでした';
});
</script>
</body>
</html>
